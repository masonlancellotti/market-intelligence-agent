[project]
name = "meridian"
version = "1.0.0"
description = "MERIDIAN — a private, always-on market-intelligence research desk."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mason Lancellotti", email = "lancellottimason@gmail.com" }]

# Core runtime deps — must import for the daemon to boot.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "apscheduler>=3.11,<4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "anthropic>=0.40",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Degradable extras — the system runs without them (guarded imports).
extras = [
    "ccxt>=4.4",            # crypto OHLCV / tickers
    "yfinance>=0.2.50",     # futures proxies + fallback daily bars + indicative option chains
    "sentence-transformers>=3.3",  # local news embeddings (all-MiniLM-L6-v2)
    "sqlite-vec>=0.1.6",    # in-DB vector search
]
mac = [
    "piper-tts>=1.2",       # local morning-brief audio (Apple Silicon)
    "playwright>=1.49",     # designed push cards (headless Chromium OG screenshots)
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.22",          # httpx mocking for connector tests
]

[project.scripts]
meridiand = "meridian.app:main"
meridian-notify = "meridian.notify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
